# チーム標準リポジトリ自身の CI。ここを変える MR が、全ツールを壊さないかを確かめる。
# (各ツール向けの CI 定義は ci/python-tool.yml。こちらとは別物)

stages:
  - check

check:
  stage: check
  # git が入ったイメージを使う(テストで git を使うため)。社内レジストリを使う場合は書き換える
  image: python:3.12
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install -q -r plugins/team/tool-versions.txt pyyaml
  script:
    # スクリプト類が、チーム共通の ruff 設定に合っているか
    - ruff format --check --config plugins/team/ruff.toml .
    - ruff check --config plugins/team/ruff.toml .
    # フック・CI スクリプト・管理スクリプト・ファイル同士の整合性のテスト
    - python -m pytest -q -p no:cacheprovider tests
    # ひな形のサンプルツールが動くか
    - cd plugins/team/templates/tool
    - pip install -q -r requirements.txt
    - python -m pytest -q -p no:cacheprovider
