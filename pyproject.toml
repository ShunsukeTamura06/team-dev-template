# ツール設定のみ。依存ライブラリは requirements.txt / requirements-dev.txt で管理する。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: 基本スタイル  F: 未使用・未定義  I: import順  B: バグになりやすい書き方  UP: 古い書き方
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
